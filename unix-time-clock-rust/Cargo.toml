[package]
name = "unix-time-clock"
version = "0.1.0"
authors = ["Jere Helén <xneme@me.com>"]
edition = "2021"
resolver = "2"
rust-version = "1.71"

[[bin]]
name = "unix-time-clock"
harness = false # do not use the built in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice and they don't increase the size on Flash
opt-level = "z"

[features]
default = ["std", "embassy", "esp-idf-svc/native"]

pio = ["esp-idf-svc/pio"]
std = ["alloc", "esp-idf-svc/binstart", "esp-idf-svc/std"]
alloc = ["esp-idf-svc/alloc"]
nightly = ["esp-idf-svc/nightly"]
experimental = ["esp-idf-svc/experimental"]
embassy = ["esp-idf-svc/embassy-sync", "esp-idf-svc/critical-section", "esp-idf-svc/embassy-time-driver"]

[dependencies]
log = { version = "0.4", default-features = false }
esp-idf-svc = { version = "0.51.0", default-features = false }
embedded-svc = { version = "0.27.1", default-features = false }
esp-idf-hal = { version = "0.45.2", default-features = false }
esp-idf-sys = { version = "0.36.1", default-features = false, features = ["binstart"] }
anyhow = "=1.0.71"
chrono = "0.4.38"
ws2812-esp32-rmt-driver = { version = "0.12.0", features = ["smart-leds-trait"] }
smart-leds = "0.4.0"

[build-dependencies]
embuild = { version = "0.33.0", features = ["espidf"] }
anyhow = "=1.0.71"
